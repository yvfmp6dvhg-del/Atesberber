<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ateş Erkek Kuaförü</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Premium Look) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F3E5AB;
            --bg-deep: #050505;
            --surface: #121212;
            --surface-hover: #1A1A1A;
            --text-main: #F8F8F8;
            --text-muted: #888888;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        .font-serif-brand { font-family: 'Playfair Display', serif; }
        .text-gold { color: var(--gold); }
        .bg-gold { background-color: var(--gold); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .date-card {
            min-width: 64px;
            padding: 12px 0;
            border-radius: 20px;
            background: transparent;
            border: 1px solid transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .date-card.active {
            background: var(--surface);
            border-color: rgba(212, 175, 55, 0.3);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        
        .time-pill {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            transition: all 0.2s;
            color: var(--text-main);
        }
        .time-pill.available:active {
            transform: scale(0.95);
            background: var(--gold);
            color: #000;
        }
        .time-pill.booked {
            background: transparent;
            border-color: rgba(255,255,255,0.02);
            color: #333;
            text-decoration: line-through;
            pointer-events: none;
        }
        .time-pill.my-booking {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--gold);
            color: var(--gold);
        }

        #bottomSheet {
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
        }
        .sheet-overlay {
            transition: opacity 0.3s ease;
        }

        .minimal-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #333;
            border-radius: 0;
            padding: 12px 0;
            color: white;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        .minimal-input:focus {
            outline: none;
            border-bottom-color: var(--gold);
        }
        .minimal-input::placeholder { color: #555; }

        .service-btn {
            background: var(--surface);
            border: 1px solid #222;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .service-btn.selected {
            background: var(--gold);
            border-color: var(--gold);
            color: #000;
            font-weight: 500;
        }

        .floating-contact {
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen relative pb-24">

    <!-- Header -->
    <header class="pt-10 pb-6 px-6 text-center">
        <h1 class="font-serif-brand text-4xl font-bold tracking-wide text-gold mb-1">ATEŞ</h1>
        <p class="text-[10px] tracking-[0.4em] text-gray-500 uppercase">Erkek Kuaförü</p>
    </header>

    <!-- Welcome -->
    <div class="px-6 mb-8 text-center">
        <h2 class="text-xl font-light text-gray-200">Hoş Geldiniz.</h2>
        <p class="text-sm text-gray-500 mt-1">Randevunuzu oluşturmak için bir saat seçin.</p>
    </div>

    <main class="flex-grow w-full max-w-md mx-auto">
        <!-- Date Scroller -->
        <div class="mb-10">
            <div class="flex justify-between items-end px-6 mb-4">
                <span class="text-xs font-semibold uppercase tracking-widest text-gray-400">Tarih</span>
                <span id="selectedMonthDisplay" class="text-xs text-gold"></span>
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar px-6 snap-x" id="dateStrip"></div>
        </div>

        <!-- Times -->
        <div class="px-6 relative min-h-[250px]">
            <div class="flex justify-between items-center mb-4">
                <span class="text-xs font-semibold uppercase tracking-widest text-gray-400">Saat</span>
                <div class="flex gap-3 text-[10px] text-gray-500">
                    <span class="flex items-center gap-1.5"><div class="w-1.5 h-1.5 rounded-full bg-gray-300"></div> Boş</span>
                    <span class="flex items-center gap-1.5"><div class="w-1.5 h-1.5 rounded-full bg-[#333]"></div> Dolu</span>
                </div>
            </div>
            
            <div id="slotsLoader" class="absolute inset-0 flex items-center justify-center bg-[#050505]/80 backdrop-blur-sm z-10 hidden">
                <i class="fa-solid fa-circle-notch fa-spin text-xl text-gold"></i>
            </div>

            <div id="timeSlotsGrid" class="grid grid-cols-4 gap-3"></div>
        </div>
    </main>

    <!-- Floating Contact -->
    <div class="floating-contact fixed bottom-0 left-0 right-0 py-4 px-6 flex justify-between items-center z-30">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-surface flex items-center justify-center border border-[#222]">
                <img src="https://ui-avatars.com/api/?name=Omer+Ates&background=D4AF37&color=000&rounded=true&bold=true" alt="Ömer Ateş" class="w-full h-full rounded-full">
            </div>
            <div>
                <p class="text-sm font-medium text-white">Ömer Ateş</p>
                <p class="text-[11px] text-gray-400">0507 135 0245</p>
            </div>
        </div>
        <div class="flex gap-3">
            <button id="myAppointmentsBtn" class="hidden w-10 h-10 rounded-full bg-surface border border-[#222] text-gold flex items-center justify-center">
                <i class="fa-solid fa-calendar-check"></i>
            </button>
            <a href="https://wa.me/905071350245?text=Merhaba,%20randevu%20ile%20ilgili%20bilgi%20almak%20istiyorum." target="_blank" 
               class="w-10 h-10 rounded-full bg-[#25D366] text-white flex items-center justify-center shadow-[0_0_15px_rgba(37,211,102,0.3)]">
                <i class="fa-brands fa-whatsapp text-lg"></i>
            </a>
        </div>
    </div>

    <!-- Bottom Sheet Modal -->
    <div id="sheetOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 opacity-0 pointer-events-none sheet-overlay"></div>
    
    <div id="bottomSheet" class="fixed bottom-0 left-0 right-0 bg-[#121212] z-50 rounded-t-[32px] transform translate-y-full border-t border-[#222] max-h-[90vh] overflow-y-auto">
        <div class="w-full flex justify-center pt-4 pb-2" id="closeSheetDrag">
            <div class="w-12 h-1.5 bg-[#333] rounded-full"></div>
        </div>

        <div class="px-6 pb-8 pt-2">
            <div class="mb-8 text-center">
                <p class="text-sm text-gray-400 uppercase tracking-widest mb-1">Seçilen Zaman</p>
                <h3 id="sheetTimeDisplay" class="font-serif-brand text-2xl text-gold"></h3>
            </div>

            <form id="appointmentForm" class="space-y-6">
                <input type="hidden" id="hiddenTimeSlot">
                <input type="hidden" id="hiddenService" value="Saç Kesimi">

                <div>
                    <label class="block text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-3">Hizmet Seçin</label>
                    <div class="flex flex-wrap gap-2" id="serviceButtons">
                        <button type="button" class="service-btn selected px-5 py-2.5 rounded-full text-sm" data-val="Saç Kesimi">Saç</button>
                        <button type="button" class="service-btn px-5 py-2.5 rounded-full text-sm" data-val="Sakal Tıraşı">Sakal</button>
                        <button type="button" class="service-btn px-5 py-2.5 rounded-full text-sm" data-val="Saç & Sakal">Saç + Sakal</button>
                    </div>
                </div>

                <div class="space-y-4">
                    <input type="text" id="customerName" required placeholder="Adınız Soyadınız" class="minimal-input w-full block">
                    <input type="tel" id="customerPhone" required placeholder="Telefon Numaranız (05XX...)" pattern="[0-9\s]{10,13}" class="minimal-input w-full block">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-gold hover:bg-[#c5a028] text-black font-semibold text-lg py-4 rounded-2xl flex items-center justify-center gap-2 transition-all mt-4">
                    Onayla
                </button>
            </form>
        </div>
    </div>

    <!-- Firebase ve Uygulama Mantığı -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, addDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Senin Kendi Firebase Bilgilerin
        const firebaseConfig = {
            apiKey: "AIzaSyD-D8Fu2a6o6Fr1KrQ-cMWdSIs2g2bo2Jw",
            authDomain: "atesberber-4d1da.firebaseapp.com",
            projectId: "atesberber-4d1da",
            storageBucket: "atesberber-4d1da.firebasestorage.app",
            messagingSenderId: "755977279044",
            appId: "1:755977279044:web:18c12439c3ca3561cb4e11",
            measurementId: "G-56N416P7E2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let currentUser = null;

        const state = {
            selectedDate: new Date(),
            appointmentsForDay: [],
            hours: { weekday: { start: 8, end: 22 }, weekend: { start: 8, end: 23 } }
        };
        state.selectedDate.setHours(0,0,0,0);

        const DOM = {
            dateStrip: document.getElementById('dateStrip'),
            monthDisplay: document.getElementById('selectedMonthDisplay'),
            timeSlotsGrid: document.getElementById('timeSlotsGrid'),
            loader: document.getElementById('slotsLoader'),
            
            sheetOverlay: document.getElementById('sheetOverlay'),
            bottomSheet: document.getElementById('bottomSheet'),
            closeSheetDrag: document.getElementById('closeSheetDrag'),
            form: document.getElementById('appointmentForm'),
            hiddenTime: document.getElementById('hiddenTimeSlot'),
            hiddenService: document.getElementById('hiddenService'),
            timeDisplay: document.getElementById('sheetTimeDisplay'),
            serviceBtns: document.querySelectorAll('.service-btn'),
            nameInput: document.getElementById('customerName'),
            phoneInput: document.getElementById('customerPhone'),
            submitBtn: document.getElementById('submitBtn'),
            
            myAppsBtn: document.getElementById('myAppointmentsBtn')
        };

        let appointmentsListener = null;

        const utils = {
            formatDateTR: (date) => date.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long' }),
            getMonthTR: (date) => date.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' }),
            getShortDay: (date) => date.toLocaleDateString('tr-TR', { weekday: 'short' }),
            formatDB: (date) => {
                const d = new Date(date);
                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            },
            isWeekend: (date) => date.getDay() === 0 || date.getDay() === 6,
            toast: (title, text, icon) => {
                Swal.fire({
                    title: title, text: text, icon: icon,
                    background: '#1A1A1A', color: '#F8F8F8', confirmButtonColor: '#D4AF37',
                    customClass: { popup: 'rounded-[24px] border border-[#333]', title: 'font-serif-brand text-gold' }
                });
            }
        };

        async function initAuth() {
            try {
                const cred = await signInAnonymously(auth);
                currentUser = cred.user;
            } catch (e) { 
                console.error("Auth Hatası:", e); 
            }
        }

        const ui = {
            renderDates: () => {
                DOM.dateStrip.innerHTML = '';
                DOM.monthDisplay.textContent = utils.getMonthTR(state.selectedDate);
                const today = new Date(); today.setHours(0,0,0,0);

                for (let i = 0; i < 14; i++) {
                    const date = new Date(today);
                    date.setDate(today.getDate() + i);
                    
                    const isSelected = date.getTime() === state.selectedDate.getTime();
                    const dayName = i === 0 ? 'BGN' : (i === 1 ? 'YRN' : utils.getShortDay(date).substring(0,3).toUpperCase());
                    
                    const btn = document.createElement('button');
                    btn.className = `date-card flex flex-col items-center snap-start flex-shrink-0 ${isSelected ? 'active' : 'opacity-50'}`;
                    btn.innerHTML = `
                        <span class="text-[10px] font-semibold tracking-widest ${isSelected ? 'text-gold' : 'text-gray-400'}">${dayName}</span>
                        <span class="text-xl font-light mt-1 ${isSelected ? 'text-white' : 'text-gray-400'}">${date.getDate()}</span>
                    `;
                    
                    btn.onclick = () => {
                        state.selectedDate = new Date(date);
                        ui.renderDates();
                        fetchData();
                    };
                    DOM.dateStrip.appendChild(btn);
                }
            },

            renderTimes: () => {
                DOM.timeSlotsGrid.innerHTML = '';
                const bounds = utils.isWeekend(state.selectedDate) ? state.hours.weekend : state.hours.weekday;
                const now = new Date();
                const isToday = state.selectedDate.toDateString() === now.toDateString();
                let hasSlots = false;

                for (let h = bounds.start; h < bounds.end; h++) {
                    for (let m = 0; m < 60; m += 30) {
                        if (isToday && (h < now.getHours() || (h === now.getHours() && m <= now.getMinutes()))) continue;
                        
                        hasSlots = true;
                        const time = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
                        const appData = state.appointmentsForDay.find(a => a.time === time);
                        
                        const btn = document.createElement('button');
                        btn.className = 'time-pill py-3 text-sm flex items-center justify-center font-medium';
                        btn.textContent = time;

                        if (appData) {
                            if (currentUser && appData.userId === currentUser.uid) {
                                btn.classList.add('my-booking');
                                btn.innerHTML = `${time} <i class="fa-solid fa-check ml-1 text-[10px]"></i>`;
                                btn.onclick = () => cancelApp(appData);
                            } else {
                                btn.classList.add('booked');
                            }
                        } else {
                            btn.classList.add('available');
                            btn.onclick = () => openSheet(time);
                        }
                        DOM.timeSlotsGrid.appendChild(btn);
                    }
                }

                if (!hasSlots) DOM.timeSlotsGrid.innerHTML = `<div class="col-span-full py-8 text-center text-xs text-gray-500">Seçilebilir saat bulunamadı.</div>`;
                
                const hasMyApps = currentUser && state.appointmentsForDay.some(a => a.userId === currentUser.uid);
                DOM.myAppsBtn.classList.toggle('hidden', !hasMyApps);
            }
        };

        function openSheet(time) {
            DOM.hiddenTime.value = time;
            DOM.timeDisplay.innerHTML = `${utils.formatDateTR(state.selectedDate)} <span class="text-gray-600 font-sans font-light mx-2">|</span> ${time}`;
            
            DOM.sheetOverlay.classList.remove('pointer-events-none', 'opacity-0');
            DOM.bottomSheet.classList.remove('translate-y-full');
            
            if(!DOM.nameInput.value) setTimeout(() => DOM.nameInput.focus(), 400);
        }

        function closeSheet() {
            DOM.sheetOverlay.classList.add('opacity-0', 'pointer-events-none');
            DOM.bottomSheet.classList.add('translate-y-full');
            
            DOM.serviceBtns.forEach(b => b.classList.remove('selected'));
            DOM.serviceBtns[0].classList.add('selected');
            DOM.hiddenService.value = DOM.serviceBtns[0].dataset.val;
        }

        DOM.sheetOverlay.onclick = closeSheet;
        DOM.closeSheetDrag.onclick = closeSheet;

        DOM.serviceBtns.forEach(btn => {
            btn.onclick = (e) => {
                DOM.serviceBtns.forEach(b => b.classList.remove('selected'));
                e.target.classList.add('selected');
                DOM.hiddenService.value = e.target.dataset.val;
            };
        });

        function fetchData() {
            if (!currentUser) return ui.renderTimes();
            if (appointmentsListener) appointmentsListener();
            
            DOM.loader.classList.remove('hidden');
            const dateStr = utils.formatDB(state.selectedDate);
            
            const ref = collection(db, 'randevular');
            appointmentsListener = onSnapshot(ref, (snap) => {
                state.appointmentsForDay = snap.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .filter(a => a.date === dateStr);
                    
                ui.renderTimes();
                DOM.loader.classList.add('hidden');
            }, err => {
                console.error(err);
                DOM.loader.classList.add('hidden');
            });
        }

        DOM.form.onsubmit = async (e) => {
            e.preventDefault();
            if(!currentUser) return utils.toast('Hata', 'Bağlantı sorunu, lütfen sayfayı yenileyin.', 'error');

            const time = DOM.hiddenTime.value;
            if(state.appointmentsForDay.some(a => a.time === time)) {
                return utils.toast('Dolu', 'Bu saat az önce başkası tarafından alındı.', 'error');
            }

            const origText = DOM.submitBtn.innerHTML;
            DOM.submitBtn.disabled = true;
            DOM.submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';

            try {
                await addDoc(collection(db, 'randevular'), {
                    userId: currentUser.uid,
                    date: utils.formatDB(state.selectedDate),
                    time: time,
                    name: DOM.nameInput.value.trim(),
                    phone: DOM.phoneInput.value.trim(),
                    service: DOM.hiddenService.value,
                    createdAt: serverTimestamp()
                });
                
                localStorage.setItem('ates_name', DOM.nameInput.value.trim());
                localStorage.setItem('ates_phone', DOM.phoneInput.value.trim());
                
                closeSheet();
                utils.toast('Onaylandı', `${time} randevunuz başarıyla oluşturuldu.`, 'success');
            } catch (err) {
                console.error(err);
                utils.toast('Hata', 'Kaydedilemedi.', 'error');
            } finally {
                DOM.submitBtn.disabled = false;
                DOM.submitBtn.innerHTML = origText;
            }
        };

        function cancelApp(appData) {
            Swal.fire({
                title: 'İptal?',
                text: `${appData.time} randevunuz silinecek.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e53e3e',
                cancelButtonColor: '#333',
                confirmButtonText: 'Evet, Sil',
                cancelButtonText: 'Vazgeç',
                background: '#1A1A1A', color: '#F8F8F8'
            }).then(async (res) => {
                if (res.isConfirmed && currentUser) {
                    try {
                        await deleteDoc(doc(db, 'randevular', appData.id));
                        utils.toast('Silindi', 'Randevunuz iptal edildi.', 'success');
                    } catch(err) {
                        console.error(err);
                        utils.toast('Hata', 'Silinemedi.', 'error');
                    }
                }
            });
        }

        DOM.myAppsBtn.onclick = () => {
            const myApp = state.appointmentsForDay.find(a => a.userId === currentUser.uid);
            if (myApp) utils.toast('Bilgi', `Saat ${myApp.time} için randevunuz var. İptal etmek için saat butonuna tıklayın.`, 'info');
        };

        async function init() {
            await initAuth();
            if (localStorage.getItem('ates_name')) {
                DOM.nameInput.value = localStorage.getItem('ates_name');
                DOM.phoneInput.value = localStorage.getItem('ates_phone');
            }
            ui.renderDates();
            fetchData();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
